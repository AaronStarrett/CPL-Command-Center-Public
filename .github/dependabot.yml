version: 2
# Dependabot bypasses repository Actions disablement; keep automatic updates paused.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - javascript
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    labels:
      - dependencies
      - github-actions
