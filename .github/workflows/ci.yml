# BEA_HOSTED_ACTIONS_PARKED
# Hosted GitHub Actions are parked to avoid runner charges.
# Local merge gate: pnpm verify:precommit (always-on Cursor rule + git hook).
# Restore: remove this stub and uncomment the original body between the ORIGINAL markers.
name: parked-phase-1-3-5-repository-and-cloud-readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parked:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"

