packages:
  - apps/*
  - packages/*

# Preserve the reviewed linkless layout on the external exFAT SSD. pnpm 11
# otherwise attempts an implicit reinstall before scripts using symlinks.
nodeLinker: hoisted
enableGlobalVirtualStore: false
packageImportMethod: copy
injectWorkspacePackages: true
dedupeInjectedDeps: false
symlink: false
preferSymlinkedExecutables: false
hoistWorkspacePackages: false
storeDir: .data/tooling/pnpm-store
verifyDepsBeforeRun: error

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@cloudflare/unenv-preset@2.16.2"
  - "@cloudflare/workerd-darwin-64@1.20260921.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260921.1"
  - "@cloudflare/workerd-linux-64@1.20260921.1"
  - "@cloudflare/workerd-linux-arm64@1.20260921.1"
  - "@cloudflare/workerd-windows-64@1.20260921.1"
  - miniflare@5.20260921.0-alpha
  - workerd@1.20260921.1
  - wrangler@4.136.1
